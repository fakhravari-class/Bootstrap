<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="نمونهٔ اجرایی فروشگاه نهایی Bootstrap 6"><title>پروژهٔ پایانی؛ فروشگاه کوچک Bootstrap 6</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{font:15px/1.8 Vazir FD-WOL,Tahoma,sans-serif;background:#f4f7fa;color:#17263a}.container{max-width:1180px}.surface{background:#fff;border:1px solid #d9e1e9;border-radius:14px}.sample-code{direction:ltr;text-align:left;white-space:pre;overflow:auto;background:#f3f7fb;border-left:4px solid #2e78c4;border-radius:8px;padding:1rem;font:12px/1.55 Consolas,monospace}.kw{color:#7c3aed;font-weight:700}.fn{color:#075fc8;font-weight:700}.str{color:#087a36}.num{color:#c04a10}.product-card{height:100%}</style></head><body><main class="container py-4"><header class="surface p-3 p-md-4 mb-4"><div class="d-flex flex-wrap align-items-center justify-content-between gap-3"><a class="navbar-brand fw-bold" href="#home">روزنو</a><label class="form-field flex-grow-1" style="max-width:34rem"><span class="visually-hidden">جست‌وجوی محصول</span><input id="search" class="form-control" type="search" placeholder="نام کالا را جست‌وجو کنید"></label><div class="badge theme-primary p-2">سبد <span id="cartCount">۰</span> کالا</div></div></header><div class="row g-4"><aside class="col-12 lg:col-3"><section class="surface p-3"><h1 class="h5">دسته‌بندی</h1><label class="form-field d-flex gap-2"><input class="check category-filter" type="checkbox" value="لوازم‌التحریر"><span>لوازم‌التحریر</span></label><label class="form-field d-flex gap-2"><input class="check category-filter" type="checkbox" value="خانه"><span>خانه</span></label><label class="form-field d-flex gap-2"><input class="check category-filter" type="checkbox" value="دیجیتال"><span>دیجیتال</span></label><hr><label class="form-field"><span class="form-label">مرتب‌سازی</span><select id="sort" class="form-control"><option value="popular">پیشنهادی</option><option value="low">ارزان‌ترین</option><option value="high">گران‌ترین</option></select></label><div class="mt-3"><h2 class="h6">سبد شما</h2><ul id="cartItems" class="list-group"></ul><p class="mt-2 mb-0">جمع: <strong id="cartTotal">۰ تومان</strong></p></div></section></aside><section class="col-12 lg:col-9" aria-labelledby="productsTitle"><div class="d-flex align-items-center justify-content-between mb-3"><h2 id="productsTitle" class="h4 mb-0">محصولات</h2><span id="resultCount" class="text-body-secondary"></span></div><div id="products" class="row g-3"></div><p id="status" class="mt-3" aria-live="polite"></p></section></div><section class="surface p-3 mt-4"><h2 class="h5">راهنمای کد سبد</h2><pre class="sample-code"><code><span class="kw">const</span> cart = [];

<span class="kw">function</span> <span class="fn">addProduct</span>(product) {
  <span class="kw">const</span> item = cart.find(row =&gt; row.id === product.id);
  <span class="kw">if</span> (item) item.quantity += <span class="num">1</span>;
  <span class="kw">else</span> cart.push({ ...product, quantity: <span class="num">1</span> });
  <span class="fn">renderCart</span>();
}</code></pre></section></main><script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script><script type="module">const products=[{id:1,name:'دفتر روزانه',category:'لوازم‌التحریر',price:85000,desc:'جلد سخت، ۸۰ برگ'},{id:2,name:'خودکار مشکی',category:'لوازم‌التحریر',price:45000,desc:'نوک روان برای نوشتن روزانه'},{id:3,name:'ماگ سرامیکی',category:'خانه',price:120000,desc:'گنجایش ۳۰۰ میلی‌لیتر'},{id:4,name:'چراغ مطالعه',category:'خانه',price:390000,desc:'نور قابل تنظیم برای میز کار'},{id:5,name:'ماوس بی‌سیم',category:'دیجیتال',price:480000,desc:'اتصال بی‌سیم و طراحی سبک'},{id:6,name:'هدفون روزانه',category:'دیجیتال',price:820000,desc:'مناسب شنیدن موسیقی و کلاس'}];const cart=[];const root=document.querySelector('#products');const money=n=>n.toLocaleString('fa-IR')+' تومان';function addProduct(product){const item=cart.find(row=>row.id===product.id);if(item)item.quantity+=1;else cart.push({...product,quantity:1});renderCart();document.querySelector('#status').textContent=product.name+' به سبد اضافه شد.';}function renderCart(){const count=cart.reduce((sum,item)=>sum+item.quantity,0);const total=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);document.querySelector('#cartCount').textContent=count.toLocaleString('fa-IR');document.querySelector('#cartTotal').textContent=money(total);document.querySelector('#cartItems').innerHTML=cart.length?cart.map(item=>'<li class="list-group-item d-flex justify-content-between"><span>'+item.name+' × '+item.quantity+'</span><span>'+money(item.price*item.quantity)+'</span></li>').join(''):'<li class="list-group-item">سبد خالی است.</li>';}function renderProducts(){const query=document.querySelector('#search').value.trim();const selected=[...document.querySelectorAll('.category-filter:checked')].map(input=>input.value);let list=products.filter(product=>product.name.includes(query)&&(!selected.length||selected.includes(product.category)));const sort=document.querySelector('#sort').value;if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);document.querySelector('#resultCount').textContent=list.length.toLocaleString('fa-IR')+' کالا';root.innerHTML=list.map(product=>'<article class="col-12 sm:col-6 xl:col-4"><div class="card product-card"><div class="card-body d-flex flex-column"><span class="badge theme-success align-self-start">'+product.category+'</span><h3 class="h5 mt-2">'+product.name+'</h3><p class="text-body-secondary">'+product.desc+'</p><strong class="mt-auto">'+money(product.price)+'</strong><button class="btn-solid theme-primary w-100 mt-3" data-product="'+product.id+'">افزودن به سبد</button></div></div></article>').join('')||'<p>محصولی با این مشخصات پیدا نشد.</p>';root.querySelectorAll('[data-product]').forEach(button=>button.addEventListener('click',()=>addProduct(products.find(product=>product.id===Number(button.dataset.product)))));}document.querySelector('#search').addEventListener('input',renderProducts);document.querySelector('#sort').addEventListener('change',renderProducts);document.querySelectorAll('.category-filter').forEach(input=>input.addEventListener('change',renderProducts));renderProducts();renderCart();</script></body></html>
